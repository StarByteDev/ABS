name: abs_pulse
publish_to: 'none'
description: ABS Pulse premium Flutter client for market intelligence, signals and portfolio control.
version: 1.3.5+135

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  file_picker: ^11.0.3
  url_launcher: ^6.3.0
  audioplayers: ^6.1.0
  google_mobile_ads: ^5.3.1
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/brand/abs-logo-master.png
    - assets/brand/abs-logo-512.png
    - assets/audio/abs_pulse_intro.wav

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/abs-logo-512.png
  min_sdk_android: 23

flutter_native_splash:
  color: '#06080D'
  image: assets/brand/abs-logo-512.png
  android_12:
    color: '#06080D'
    image: assets/brand/abs-logo-512.png

# Keep Android lifecycle plugin compatible with Flutter 3.24+ and avoid
# newer transitive releases that require Flutter 3.29+.
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.26
