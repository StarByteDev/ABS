openapi: 3.1.0
info:
  title: Alpha Block Solutions API
  version: 15.1.6
  description: >-
    Production API contract for Alpha Block Solutions V15.1.6. Paid Pulse package
    access uses direct USDT payment requests verified by an administrator. Public rewarded
    Free Signal now has a guest API protocol (status, session and claim) for future mobile
    clients while the current deployed rewarded creative remains Google Ad Manager web inventory.
    ABS News includes live headlines and an economic calendar API with previous, forecast and
    actual values plus simplified crypto-impact context. Authenticated Pulse reporting includes
    strategy profitability, learning evidence and research-only what-if signal simulation.
servers:
  - url: https://YOUR-DOMAIN.COM/api/v1
    description: Production
  - url: http://127.0.0.1:8000/api/v1
    description: Local development
