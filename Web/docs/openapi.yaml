openapi: 3.1.0
info:
  title: Alpha Block Solutions API
  version: 14.9.2
  description: Production mobile/API contract for Alpha Block Solutions V14.9.2, including account lifecycle, market intelligence,
    CMS content, premium Pulse page parity, private-member reporting, notification preferences and device registration.
servers:
- url: https://YOUR-DOMAIN.COM/api/v1
  description: Production
- url: http://127.0.0.1:8000/api/v1
  description: Local development
paths:
  /auth/register:
    post:
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - email
              - password
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '201':
          description: Created
        '422':
          description: Validation error
  /auth/login:
    post:
      summary: Login and issue a bearer token
      responses:
        '200':
          description: Authenticated
        '422':
          description: Invalid credentials
  /auth/me:
    get:
      summary: Current user
      security:
      - sanctum: []
      responses:
        '200':
          description: User
  /auth/logout:
    post:
      summary: Delete current token
      security:
      - sanctum: []
      responses:
        '200':
          description: Logged out
  /dashboard:
    get:
      summary: Mobile dashboard payload
      security:
      - sanctum: []
      responses:
        '200':
          description: Dashboard
  /profile:
    patch:
      summary: Update profile
      security:
      - sanctum: []
      responses:
        '200':
          description: Updated
        '422':
          description: Validation error
  /market/overview:
    get:
      summary: Core live market and global overview
      parameters:
      - in: query
        name: refresh
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Market overview including provider source and availability status
  /market/movers:
    get:
      summary: Top gainers and losers
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          default: 5
          minimum: 1
          maximum: 20
      - in: query
        name: refresh
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Movers including provider source and availability status
  /market/chart/{symbol}:
    get:
      summary: Candlestick chart data
      parameters:
      - in: path
        name: symbol
        required: true
        schema:
          type: string
          example: BTCUSDT
      - in: query
        name: interval
        schema:
          type: string
          enum:
          - 5m
          - 15m
          - 1h
          - 4h
          - 1d
          default: 1h
      - in: query
        name: limit
        schema:
          type: integer
          default: 80
          minimum: 10
          maximum: 500
      - in: query
        name: refresh
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Candles including provider source and availability status
  /products:
    get:
      summary: Products
      responses:
        '200':
          description: Products
  /news:
    get:
      summary: Published original ABS editorial news
      parameters:
      - in: query
        name: featured
        required: false
        schema:
          type: boolean
          default: false
        description: Return only articles selected for Latest Market Headlines.
      - in: query
        name: category
        required: false
        schema:
          type: string
      - in: query
        name: per_page
        required: false
        schema:
          type: integer
          default: 15
          minimum: 1
          maximum: 50
      responses:
        '200':
          description: Paginated ABS editorial news with featured articles ordered first
  /news/live:
    get:
      summary: Source-attributed publisher headlines
      responses:
        '200':
          description: External headline metadata and original-source URLs
  /news/{slug}:
    get:
      summary: News article
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Article
        '404':
          description: Not found
  /legal/{type}:
    get:
      summary: Public legal content
      parameters:
      - in: path
        name: type
        required: true
        schema:
          type: string
          enum:
          - privacy
          - terms
          - risk
          - disclaimer
      responses:
        '200':
          description: Legal content
        '404':
          description: Unknown legal type
  /search:
    get:
      summary: Search public content
      parameters:
      - in: query
        name: q
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Results
  /watchlist:
    get:
      summary: Watchlist
      security:
      - sanctum: []
      responses:
        '200':
          description: Items
    post:
      summary: Add or update watchlist item
      security:
      - sanctum: []
      responses:
        '201':
          description: Saved
  /watchlist/{symbol}:
    delete:
      summary: Remove watchlist item
      security:
      - sanctum: []
      parameters:
      - in: path
        name: symbol
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Removed
  /notifications:
    get:
      summary: Notifications
      security:
      - sanctum: []
      responses:
        '200':
          description: Notifications
  /notifications/{id}/read:
    post:
      summary: Mark notification read
      security:
      - sanctum: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Updated
  /newsletter:
    post:
      summary: Subscribe
      responses:
        '201':
          description: Subscribed
  /private/account:
    get:
      summary: Private member account overview
      security:
      - sanctum: []
      responses:
        '200':
          description: Account
        '403':
          description: Private access denied
  /private/statements/{statement}:
    get:
      summary: Private member monthly statement
      security:
      - sanctum: []
      parameters:
      - in: path
        name: statement
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Statement
        '403':
          description: Not authorized
  /pulse/access:
    get:
      tags:
      - Pulse
      summary: Current user Pulse access, assigned plan and effective capability matrix
      security:
      - sanctum: []
      responses:
        '200':
          description: Access payload
  /pulse/plans:
    get:
      tags:
      - Pulse
      summary: Active administrator-created Pulse plans, limits, strategies and capability matrix
      security:
      - sanctum: []
      responses:
        '200':
          description: Plans
  /pulse/membership:
    get:
      tags:
      - Pulse
      summary: Current membership, public plans, request history, assigned offers and authenticated payment configuration
      security:
      - sanctum: []
      responses:
        '200':
          description: Membership payload
  /pulse/membership/quote:
    post:
      tags:
      - Pulse
      summary: Validate a public membership and optional coupon or gift voucher
      security:
      - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - pulse_plan_id
              properties:
                pulse_plan_id:
                  type: integer
                promotion_code:
                  type: string
      responses:
        '200':
          description: Membership quote and payment configuration
        '422':
          description: Validation or promotion error
  /pulse/membership/requests:
    post:
      tags:
      - Pulse
      summary: Submit a manual-USDT Pulse membership request
      security:
      - sanctum: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - pulse_plan_id
              properties:
                pulse_plan_id:
                  type: integer
                promotion_code:
                  type: string
                payment_reference:
                  type: string
                payment_proof:
                  type: string
                  format: binary
                user_notes:
                  type: string
      responses:
        '201':
          description: Membership request created or full gift voucher activated
        '422':
          description: Validation or payment configuration error
  /pulse/membership/requests/{membershipRequest}:
    patch:
      tags:
      - Pulse
      summary: Cancel an owned open membership request
      security:
      - sanctum: []
      parameters:
      - in: path
        name: membershipRequest
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Request cancelled
        '403':
          description: Not the request owner
        '422':
          description: Request is already closed
  /pulse/dashboard:
    get:
      tags:
      - Pulse
      summary: Pulse dashboard data plus effective capability matrix for the authenticated user
      security:
      - sanctum: []
      responses:
        '200':
          description: Pulse dashboard
        '403':
          description: Pulse access denied
  /pulse/usage:
    get:
      tags:
      - Pulse
      summary: Today's plan-aware scanner and signal usage, remaining allowances and reset time
      security:
      - sanctum: []
      responses:
        '200':
          description: Daily Pulse usage and remaining quotas
        '403':
          description: Pulse access denied
  /pulse/pairs:
    get:
      tags:
      - Pulse
      summary: Plan-aware active Binance USD-M perpetual Futures market catalog, exchange filters and current selections
      security:
      - sanctum: []
      responses:
        '200':
          description: Pairs
  /pulse/settings:
    get:
      tags:
      - Pulse
      summary: Current user Pulse execution, risk, notification and pair-selection cooldown settings
      security:
      - sanctum: []
      responses:
        '200':
          description: Settings
    put:
      tags:
      - Pulse
      summary: Update current user Pulse settings
      security:
      - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                environment:
                  type: string
                  enum:
                  - testnet
                  - live
                execution_mode:
                  type: string
                  enum:
                  - signal_only
                  - manual
                  - automatic
                auto_trade_enabled:
                  type: boolean
                emergency_stop:
                  type: boolean
                default_leverage:
                  type: integer
                  minimum: 1
                  maximum: 20
                margin_type:
                  type: string
                  enum:
                  - ISOLATED
                  - CROSSED
                position_mode:
                  type: string
                  enum:
                  - BOTH
                  - LONG
                  - SHORT
                sizing_mode:
                  type: string
                  enum:
                  - fixed_notional
                  - fixed_quantity
                fixed_notional:
                  type: number
                fixed_quantity:
                  type: number
                minimum_signal_score:
                  type: number
                  description: Personal scanner/signal threshold. This saved profile value overrides the package default.
                selected_pairs:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Updated
        '422':
          description: Validation or permission failure
        '423':
          description: Trading-pair selection is still inside the 50-hour cooldown
  /pulse/scanner/runs:
    get:
      tags:
      - Pulse
      summary: Paginated scanner history for the current user
      security:
      - sanctum: []
      responses:
        '200':
          description: Scanner runs
  /pulse/scanner/overview:
    get:
      tags:
      - Pulse
      summary: Screen-ready Market Scanner summary, filters, setup rows, market conditions and scan quality
      security:
      - sanctum: []
      parameters:
      - in: query
        name: min_score
        schema:
          type: number
          minimum: 0
          maximum: 100
      - in: query
        name: direction
        schema:
          type: string
          enum: [all, long, short]
      - in: query
        name: strategy
        description: Strategy slug from the authenticated user's included 15-strategy package catalog, or all
        schema:
          type: string
      - in: query
        name: timeframe
        schema:
          type: string
          enum: [all, 15m, 4h]
      responses:
        '200':
          description: Scanner screen payload
        '403':
          description: Pulse scanner access denied
  /pulse/scanner/run:
    post:
      tags:
      - Pulse
      summary: Run the explainable multi-strategy scanner across the user's saved selected markets
      security:
      - sanctum: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                symbols:
                  type: array
                  maxItems: 1000
                  description: Optional targeted subset of package-allowed symbols. Omit to scan the user's saved selected markets.
                  items:
                    type: string
                timeframe:
                  type: string
                  enum: [all, 15m, 4h]
                  example: all
                  description: Use all for one quota-safe 15M + 4H scan; each returned result keeps its actual timeframe.
      responses:
        '201':
          description: Scanner completed
        '422':
          description: Limit, permission or provider failure
  /pulse/signals:
    get:
      tags:
      - Pulse
      summary: Paginated user-specific Pulse signals
      security:
      - sanctum: []
      responses:
        '200':
          description: Signals
  /pulse/signals/overview:
    get:
      tags:
      - Pulse
      summary: Screen-ready signal queue, engagement summary, selected evidence and risk snapshot
      security:
      - sanctum: []
      parameters:
      - in: query
        name: selected
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
      - in: query
        name: direction
        schema:
          type: string
      - in: query
        name: min_score
        schema:
          type: number
      responses:
        '200':
          description: Signals screen payload
        '403':
          description: Pulse signals access denied
  /pulse/signals/{signal}:
    get:
      tags:
      - Pulse
      summary: Signal detail and strategy breakdown
      security:
      - sanctum: []
      parameters:
      - in: path
        name: signal
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Signal
        '403':
          description: Not owned by user
  /pulse/signals/{signal}/execute:
    post:
      tags:
      - Pulse
      summary: Submit a user-authorized Binance USD-M Futures order from a signal
      description: Live execution remains unavailable unless installation, system, plan and user live-trading gates are all
        enabled. Exchange-side TP/SL uses Binance conditional Algo orders.
      security:
      - sanctum: []
      parameters:
      - in: path
        name: signal
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - environment
              - order_type
              - leverage
              - stop_loss
              - take_profit
              - position_side
              - confirmed_review
              properties:
                environment:
                  type: string
                  enum:
                  - testnet
                  - live
                order_type:
                  type: string
                  enum:
                  - MARKET
                  - LIMIT
                quantity:
                  type: number
                notional:
                  type: number
                leverage:
                  type: integer
                price:
                  type: number
                stop_loss:
                  type: number
                take_profit:
                  type: number
                position_side:
                  type: string
                  enum:
                  - BOTH
                  - LONG
                  - SHORT
                time_in_force:
                  type: string
                  enum:
                  - GTC
                  - IOC
                  - FOK
                  default: GTC
                client_reference:
                  type: string
                  maxLength: 36
                  pattern: '^[.A-Za-z0-9_:/-]+$'
                confirmed_review:
                  type: boolean
                  const: true
      responses:
        '201':
          description: Local and exchange order workflow created
        '422':
          description: Risk, permission, precision, balance, exchange or protection failure
  /pulse/signals/{signal}/dismiss:
    patch:
      tags:
      - Pulse
      summary: Dismiss an owned active signal while retaining it in signal history
      security:
      - sanctum: []
      parameters:
      - in: path
        name: signal
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Signal dismissed
        '403':
          description: Signal is not owned by the current user
  /pulse/trades:
    get:
      tags:
      - Pulse
      summary: Paginated current-user Pulse trades
      security:
      - sanctum: []
      responses:
        '200':
          description: Trades
  /pulse/trades/{trade}:
    get:
      tags:
      - Pulse
      summary: Current-user trade detail
      security:
      - sanctum: []
      parameters:
      - in: path
        name: trade
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Trade
        '403':
          description: Not owned by user
  /pulse/trades/{trade}/close:
    post:
      tags:
      - Pulse
      summary: Cancel protection/orders and request a reduce-only position close on Binance
      security:
      - sanctum: []
      parameters:
      - in: path
        name: trade
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Close request processed
        '422':
          description: Exchange or state failure
  /pulse/trades/sync:
    post:
      tags:
      - Pulse
      summary: Reconcile current-user local trade records with Binance orders, positions, fills, commission and realized P&L
      security:
      - sanctum: []
      responses:
        '200':
          description: Reconciliation result
  /pulse/emergency-stop:
    post:
      tags:
      - Pulse
      summary: Disable automatic execution and attempt to cancel or close active current-user trading activity
      security:
      - sanctum: []
      responses:
        '200':
          description: Emergency stop result
  /pulse/orders:
    get:
      tags:
      - Pulse
      summary: Current-user Binance account, positions, normal orders and conditional Algo orders
      security:
      - sanctum: []
      parameters:
      - in: query
        name: environment
        schema:
          type: string
          enum:
          - testnet
          - live
      responses:
        '200':
          description: Exchange snapshot
        '422':
          description: Connection unavailable
  /pulse/reports:
    get:
      tags:
      - Pulse
      summary: Current-user Pulse trade report grouped by symbol
      security:
      - sanctum: []
      parameters:
      - in: query
        name: from
        schema:
          type: string
          format: date
      - in: query
        name: to
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Report
  /pulse/reports/signals:
    get:
      tags: [Pulse]
      summary: Signal-validation performance using permanent daily aggregates plus recent detailed validation
      security: [{sanctum: []}]
      parameters:
      - in: query
        name: from
        schema: {type: string, format: date}
      - in: query
        name: to
        schema: {type: string, format: date}
      responses:
        '200': {description: Signal-performance report}
  /pulse/reports/strategies:
    get:
      tags: [Pulse]
      summary: Strategy performance separated by strategy version, timeframe and direction
      security: [{sanctum: []}]
      responses:
        '200': {description: Strategy-performance report}
  /pulse/reports/learning:
    get:
      tags: [Pulse]
      summary: Evidence-protected strategy learning state with recency weighting and hierarchical fallback
      security: [{sanctum: []}]
      responses:
        '200': {description: Strategy learning state}
  /pulse/market-data/health:
    get:
      tags: [Pulse]
      summary: Central market-data scheduler freshness and architecture health
      security: [{sanctum: []}]
      responses:
        '200': {description: Central market-data health}
  /pulse/market-data/prices:
    get:
      tags: [Pulse]
      summary: Centrally cached Binance Futures prices for package-approved symbols; does not trigger a Binance request
      security: [{sanctum: []}]
      parameters:
      - in: query
        name: symbols[]
        schema: {type: array, items: {type: string}}
      responses:
        '200': {description: Central price snapshot}
  /pulse/signals/{signal}/validation:
    get:
      tags: [Pulse]
      summary: Current-user signal validation lifecycle and recent MFE/MAE outcome detail
      security: [{sanctum: []}]
      parameters:
      - in: path
        name: signal
        required: true
        schema: {type: integer}
      responses:
        '200': {description: Signal validation}
        '403': {description: Signal is not owned by current user}

  /pulse/binance/connections:
    get:
      tags:
      - Pulse
      summary: Masked current-user Binance connections
      security:
      - sanctum: []
      responses:
        '200':
          description: Connections
    post:
      tags:
      - Pulse
      summary: Encrypt and save a current-user Binance connection
      security:
      - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - environment
              - label
              - api_key
              - api_secret
              properties:
                environment:
                  type: string
                  enum:
                  - testnet
                  - live
                label:
                  type: string
                api_key:
                  type: string
                api_secret:
                  type: string
      responses:
        '201':
          description: Saved
        '422':
          description: Environment or validation failure
  /pulse/binance/connections/{connection}/test:
    post:
      tags:
      - Pulse
      summary: Verify Binance connectivity and trading permission without placing an order
      security:
      - sanctum: []
      parameters:
      - in: path
        name: connection
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Verified
        '422':
          description: Binance rejected or unavailable
  /pulse/binance/connections/{connection}/activate:
    post:
      tags:
      - Pulse
      summary: Activate one verified Binance Testnet or Live USD-M Futures connection as the current trading environment
      security:
      - sanctum: []
      parameters:
      - in: path
        name: connection
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Active environment changed
        '403':
          description: Environment is not permitted by system or user package
        '422':
          description: Connection must pass verification and trading-permission checks first
  /pulse/binance/connections/{connection}:
    delete:
      tags:
      - Pulse
      summary: Delete a current-user encrypted Binance connection
      security:
      - sanctum: []
      parameters:
      - in: path
        name: connection
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Deleted
  /pulse/alerts:
    get:
      tags:
      - Pulse
      summary: Paginated current-user Pulse alerts
      security:
      - sanctum: []
      responses:
        '200':
          description: Alerts
  /pulse/alerts/{alert}/read:
    patch:
      tags:
      - Pulse
      summary: Mark a current-user Pulse alert as read
      security:
      - sanctum: []
      parameters:
      - in: path
        name: alert
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Updated
  /pulse/alerts/read-all:
    patch:
      tags:
      - Pulse
      summary: Mark all current-user Pulse alerts as read
      security:
      - sanctum: []
      responses:
        '200':
          description: Updated
  /admin/pulse/dashboard:
    get:
      tags:
      - Pulse Admin
      summary: Pulse administration counters and plans
      security:
      - sanctum: []
      responses:
        '200':
          description: Admin dashboard
        '403':
          description: Admin role required
  /admin/pulse/access:
    get:
      tags:
      - Pulse Admin
      summary: Users and their Pulse plan/access records
      security:
      - sanctum: []
      responses:
        '200':
          description: Paginated users
  /admin/pulse/access/{user}:
    put:
      tags:
      - Pulse Admin
      summary: Assign a Pulse plan, change access status and apply optional user-level restrictions
      security:
      - sanctum: []
      parameters:
      - in: path
        name: user
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Updated
        '403':
          description: Admin role required
  /admin/pulse/plans:
    get:
      tags:
      - Pulse Admin
      summary: Pulse plans and feature configuration
      security:
      - sanctum: []
      responses:
        '200':
          description: Plans
    post:
      tags:
      - Pulse Admin
      summary: Create a Pulse plan with limits, default signal threshold, 15-strategy assignments, Binance Futures pair scope and capability switches
      security:
      - sanctum: []
      responses:
        '201':
          description: Plan created
        '422':
          description: Validation error
  /admin/pulse/strategies:
    get:
      tags:
      - Pulse Admin
      summary: Pulse strategies
      security:
      - sanctum: []
      responses:
        '200':
          description: Strategies
    post:
      tags:
