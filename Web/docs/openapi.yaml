openapi: 3.1.0
info:
  title: Alpha Block Solutions API
  version: 15.7.4
  description: >-
    Production API contract for Alpha Block Solutions V15.7.3. Pulse package access
    uses direct USDT payment requests verified by an administrator, with normalized
    package benefits, payment status and verification-flow data shared by web and mobile.
    Pulse Support now provides one authenticated conversation shared by web and mobile,
    with live-support presence and Pulse Assistant hand-off when the support team is away.
    Public rewarded Free Signal uses the same backend selection service for web and mobile;
    when no qualified setup is active, the response provides a clearly labelled BTC 4-Hour
    Outlook with watch zone, expected range, potential move and invalidation context.
    ABS News, economic calendar, strategy reporting and the live data-safe patch architecture
    remain available through their existing contracts.
servers:
  - url: https://YOUR-DOMAIN.COM/api/v1
    description: Production
  - url: http://127.0.0.1:8000/api/v1
    description: Local development
